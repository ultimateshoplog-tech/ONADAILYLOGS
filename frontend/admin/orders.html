<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — On A Daily Logs Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script src="../js/config.js"></script>
  <script defer src="../js/admin.js"></script>
</head>
<body>
  <div class="a-shell">
    
    <!-- Sidebar (Dynamically rendered by admin.js) -->
    <aside class="a-sidebar"></aside>

    <main class="a-main">
      <header class="a-topbar">
        <div class="a-topbar-left">
          <h1 class="a-page-title">Orders</h1>
          <p class="a-page-sub">Track purchases and process refunds.</p>
        </div>
        <div class="a-topbar-right">
          <div class="a-avatar">A</div>
        </div>
      </header>

      <div class="a-content">
        <div class="a-panel">
          <div class="a-panel-header">
            <h2 class="a-panel-title">All Orders</h2>
          </div>
          <table class="a-table" id="admin-orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Product</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="7" class="a-empty">Loading orders...</td></tr>
            </tbody>
          </table>
          <div class="a-pagination" id="orders-pagination"></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
