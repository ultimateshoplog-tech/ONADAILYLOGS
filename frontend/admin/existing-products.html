<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products — On A Daily Logs Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script src="../js/config.js"></script>
  <script defer src="../js/admin.js"></script>
</head>
<body>
  <div class="a-shell">
    
    <!-- Sidebar (Dynamically rendered by admin.js) -->
    <aside class="a-sidebar"></aside>

    <main class="a-main">
      <header class="a-topbar">
        <div class="a-topbar-left">
          <h1 class="a-page-title">All Products</h1>
          <p class="a-page-sub">Browse, edit, and manage your product catalog.</p>
        </div>
        <div class="a-topbar-right">
          <a href="add-product.html" class="a-btn a-btn-primary">Add Product</a>
          <div class="a-avatar">A</div>
        </div>
      </header>

      <div class="a-content">
        <div class="a-panel">
          <div class="a-panel-header">
            <h2 class="a-panel-title">Product Catalog</h2>
          </div>
          <table class="a-table" id="admin-products-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-list">
              <tr><td colspan="7" class="a-empty">Loading products...</td></tr>
            </tbody>
          </table>
          <div class="a-pagination" id="products-pagination"></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
