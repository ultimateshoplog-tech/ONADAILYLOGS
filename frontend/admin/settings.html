<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — On A Daily Logs Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css" />
  <script src="../js/config.js"></script>
  <script defer src="../js/admin.js"></script>
</head>
<body>
  <div class="a-shell">
    
    <!-- Sidebar (Dynamically rendered by admin.js) -->
    <aside class="a-sidebar"></aside>

    <main class="a-main">
      <header class="a-topbar">
        <div class="a-topbar-left">
          <h1 class="a-page-title">Settings</h1>
          <p class="a-page-sub">Configure wallet addresses and platform preferences.</p>
        </div>
        <div class="a-topbar-right">
          <div class="a-avatar">A</div>
        </div>
      </header>

      <div class="a-content">
        <!-- Change Password -->
        <div class="a-card">
          <h2 style="font-size:1rem; font-weight:700; margin-bottom: 1.25rem;">Change Admin Password</h2>
          <form id="change-password-form">
            <div class="a-form-grid">
              <div class="a-form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="a-input" placeholder="Enter current password" required autocomplete="current-password" />
              </div>
              <div class="a-form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="a-input" placeholder="Min 8 characters" required autocomplete="new-password" />
              </div>
              <div class="a-form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="a-input" placeholder="Repeat new password" required autocomplete="new-password" />
              </div>
            </div>
            <button type="submit" class="a-btn a-btn-primary" id="change-pw-btn">Update Password</button>
          </form>
        </div>

        <!-- Site Settings -->
        <div class="a-card" style="margin-top: 1.5rem;">
          <h2 style="font-size:1rem; font-weight:700; margin-bottom: 1.25rem;">General Platform Settings</h2>
          <form id="site-settings-form">
            <div class="a-form-grid">
              <div class="a-form-group">
                <label for="site_name">Site Name</label>
                <input type="text" id="site_name" name="site_name" class="a-input" placeholder="e.g. On A Daily Logs" required />
              </div>
              <div class="a-form-group">
                <label for="site_tagline">Site Tagline</label>
                <input type="text" id="site_tagline" name="site_tagline" class="a-input" placeholder="e.g. Premium Digital Assets & Access Tools" required />
              </div>
              <div class="a-form-group">
                <label for="min_deposit">Minimum Deposit (USD)</label>
                <input type="number" id="min_deposit" name="min_deposit" step="0.01" min="0" class="a-input" placeholder="10.00" required />
              </div>
              <div class="a-form-group">
                <label for="maintenance_mode">Maintenance Mode</label>
                <select id="maintenance_mode" name="maintenance_mode" class="a-input" style="background:#fff; color:#1e1b4b;" required>
                  <option value="false">Disabled (Site Live)</option>
                  <option value="true">Enabled (Site Down)</option>
                </select>
              </div>
            </div>
            <div class="a-form-grid" style="margin-top: 1rem;">
              <div class="a-form-group">
                <label for="btc_wallet">Bitcoin Address</label>
                <input type="text" id="btc_wallet" name="btc_wallet" class="a-input" placeholder="BTC Wallet Address" />
              </div>
              <div class="a-form-group">
                <label for="usdt_wallet">USDT Address (TRC20)</label>
                <input type="text" id="usdt_wallet" name="usdt_wallet" class="a-input" placeholder="USDT TRC20 Wallet Address" />
              </div>
            </div>
            <div class="a-form-group" style="margin-top: 1rem;">
              <label for="announcement">Announcement Banner Text</label>
              <textarea id="announcement" name="announcement" class="a-textarea" placeholder="Keep empty to hide banner..." style="min-height: 80px;"></textarea>
            </div>
            <button type="submit" class="a-btn a-btn-primary" id="save-settings-btn" style="margin-top: 0.5rem;">Save Settings</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
