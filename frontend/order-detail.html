<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details – On A Daily Logs</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/toast.js"></script>
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <style>
    /* ── Modern Credentials Viewer ── */
    .cred-container {
      margin-top: 1rem;
      border-radius: var(--radius-lg);
      background: #0F172A;
      border: 1px solid var(--border-soft);
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    body.dark-mode .cred-container {
      border-color: #1E293B;
    }
    .cred-header {
      background: #1E293B;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cred-filename {
      color: #E2E8F0;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cred-size-badge {
      background: rgba(255, 255, 255, 0.08);
      color: #94A3B8;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    
    .cred-body-wrapper {
      position: relative;
      min-height: 200px;
    }

    #cred-text-display {
      display: none;
      width: 100%;
      margin: 0;
      padding: 1.5rem;
      color: #34D399; /* Emerald Green */
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-x: auto;
      background: #0F172A;
    }

    /* Blur overlay — shown by default */
    .cred-blur-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      cursor: pointer;
      z-index: 10;
      transition: background 0.3s ease;
      padding: 2rem;
      text-align: center;
    }
    .cred-blur-overlay:hover {
      background: rgba(15, 23, 42, 0.8);
    }

    .lock-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(90, 49, 244, 0.12);
      border: 1px solid rgba(90, 49, 244, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 0.5rem;
      position: relative;
      animation: pulse-glow 2s infinite;
    }
    
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(90, 49, 244, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(90, 49, 244, 0); }
      100% { box-shadow: 0 0 0 0 rgba(90, 49, 244, 0); }
    }

    .reveal-button-modern {
      background: var(--primary);
      color: #ffffff !important;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: background var(--transition-smooth), transform 0.2s;
      box-shadow: 0 4px 14px rgba(90, 49, 244, 0.35);
    }
    .reveal-button-modern:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .cred-actions-bar {
      display: none;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .action-btn-modern {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }
    .action-btn-modern:hover {
      background: var(--bg-accent);
      border-color: var(--text-muted);
    }
    .action-btn-modern.primary-action {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .action-btn-modern.primary-action:hover {
      background: var(--primary-hover);
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid rgba(90, 49, 244, 0.2); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Activation locked overlay inside cred box */
    .act-locked {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; min-height: 220px; padding: 1.5rem;
      text-align: center; background: #0F172A; width: 100%;
    }
    .act-locked .al-icon { font-size: 2.5rem; }
    .act-locked .al-title { font-size: 1rem; font-weight: 800; color: #fff; }
    .act-locked .al-sub   { font-size: 0.82rem; color: rgba(255,255,255,0.45); max-width: 300px; line-height: 1.55; }
    .act-prog-track {
      width: 100%; max-width: 300px; height: 8px;
      background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden;
    }
    .act-prog-fill {
      height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, var(--primary), var(--primary-hover)); transition: width 1s;
    }
    .act-prog-meta {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; color: rgba(255,255,255,0.35); width: 100%; max-width: 300px;
      margin-top: 0.3rem;
    }
    .act-deposit-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff; padding: 0.7rem 1.75rem; border-radius: 10px;
      font-weight: 700; font-size: 0.9rem; text-decoration: none;
      box-shadow: 0 4px 14px rgba(90, 49, 244, 0.25); transition: opacity .2s;
    }
    .act-deposit-btn:hover { opacity: .88; }
  </style>
</head>
<body data-require-auth="true">
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" class="logo-img" alt="Logo">
        <span>On A Daily Logs</span>
      </a>
      <nav><ul class="nav-list" id="main-nav"></ul></nav>
    </div>
  </header>

  <main class="main-content page-tight container" style="max-width:780px;">
    <nav style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1.5rem;">
      <a href="index.html"  style="color:var(--text-muted);">Home</a>
      <span style="margin:0 0.5rem;">/</span>
      <a href="orders.html" style="color:var(--text-muted);">My Orders</a>
      <span style="margin:0 0.5rem;">/</span>
      <span id="breadcrumb-id" style="color:var(--primary-deep); font-weight:600;">Order Details</span>
    </nav>
    <div id="page-content">
      <div style="text-align:center; padding:4rem; color:var(--text-muted);">Loading order...</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 On A Daily Logs. All rights reserved.</p> </div>
  </footer>

  <script>
    const API_BASE = window.API_BASE || 'http://localhost:5000/api';

    // Stored in closure — never in the DOM, never in a global
    let _rawCredentials = null;

    // ── Decode base64 from server ─────────────────────────────────────────────
    function b64Decode(str) {
      try { return decodeURIComponent(escape(atob(str))); }
      catch { return str; }
    }

    // ── Render credentials onto DOM element ──────────────────────────────────
    function renderCredentials(text) {
      const display = document.getElementById('cred-text-display');
      if (!display) return;

      try {
        const data = JSON.parse(text);
        if (data && typeof data === 'object') {
          // Structured JSON tool!
          let html = '';

          if (data.type === 'cheque') {
            html = `
              <div class="cheque-display-container" style="display: flex; flex-direction: column; gap: 1.25rem; padding: 0.5rem; background: #0F172A; border-radius: 8px;">
                <div style="border-bottom: 1px solid #1E293B; padding-bottom: 0.75rem;">
                  <strong style="color: #94A3B8; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem;">Cheque Front Image</strong>
                  <div style="background: #1E293B; border-radius: 6px; overflow: hidden; text-align: center; padding: 0.5rem;">
                    <img src="${data.front_image}" alt="Cheque Front" style="max-width: 100%; max-height: 250px; object-fit: contain; cursor: pointer; border-radius: 4px;" onclick="window.open('${data.front_image}', '_blank')">
                  </div>
                </div>
                <div>
                  <strong style="color: #94A3B8; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem;">Cheque Back Image</strong>
                  <div style="background: #1E293B; border-radius: 6px; overflow: hidden; text-align: center; padding: 0.5rem;">
                    <img src="${data.back_image}" alt="Cheque Back" style="max-width: 100%; max-height: 250px; object-fit: contain; cursor: pointer; border-radius: 4px;" onclick="window.open('${data.back_image}', '_blank')">
                  </div>
                </div>
              </div>
            `;
          } else {
            // Render key-value table
            const labels = {
              card_number: 'Card Number',
              card_expire: 'Card Expire',
              cvv: 'CVV',
              name: 'Name',
              address: 'Address',
              email: 'Email',
              phone_number: 'Phone Number',
              ip: 'IP Address',
              username: 'Username',
              password: 'Password',
              bank_name: 'Bank Name',
              account_number: 'Account Number',
              routing_number: 'Routing Number',
              balance: 'Balance',
              host: 'SMTP Host',
              port: 'SMTP Port',
              secure: 'SMTP Secure'
            };

            html = `<table style="width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.85rem; color: #10B981; text-align: left;">`;
            for (const key in data) {
              if (key === 'type') continue;
              if (data[key] === undefined || data[key] === null || data[key] === '') continue;
              const label = labels[key] || key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
              html += `
                <tr style="border-bottom: 1px solid #1E293B;">
                  <td style="padding: 0.65rem 0.5rem; color: #64748B; font-weight: 600; width: 35%; font-family: sans-serif; font-size: 0.8rem;">${label}</td>
                  <td style="padding: 0.65rem 0.5rem; color: #34D399; font-weight: 600; word-break: break-all;">${data[key]}</td>
                </tr>
              `;
            }
            html += `</table>`;
          }

          display.innerHTML = html;
          display.style.display = 'block';
          return;
        }
      } catch (e) {
        // Fallback to plain text
      }

      display.textContent = text;
      display.style.display = 'block';
    }

    // ── Download credentials as a .txt file ──────────────────────────────
    function downloadCredentials() {
      if (!_rawCredentials) { toast('Reveal credentials first.', 'warning'); return; }
      
      let textToDownload = _rawCredentials;
      try {
        const data = JSON.parse(_rawCredentials);
        if (data && typeof data === 'object') {
          textToDownload = '';
          for (const key in data) {
            if (key === 'type') continue;
            textToDownload += `${key.toUpperCase().replace(/_/g, ' ')}: ${data[key]}\r\n`;
          }
        }
      } catch (e) {}

      const blob = new Blob([textToDownload], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const id = new URLSearchParams(window.location.search).get('id');
      a.href = url;
      a.download = `order_${id.substring(0,8).toUpperCase()}_credentials.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Credentials download started!', 'success');
    }

    // ── Reveal credentials: two-step token flow ───────────────────────────────
    async function revealCredentials() {
      if (_rawCredentials) { showCanvas(); return; }

      const jwt     = localStorage.getItem('token');
      const id      = new URLSearchParams(window.location.search).get('id');
      const overlay = document.getElementById('cred-overlay');
      const loading = document.getElementById('cred-loading');

      if (overlay) overlay.style.display = 'none';
      if (loading) loading.style.display = 'flex';

      try {
        // Step 1: Request one-time reveal token
        const tokenRes  = await fetch(`${API_BASE}/orders/${id}/request-credentials`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${jwt}`, 'Content-Type': 'application/json' },
        });
        const tokenData = await tokenRes.json();

        if (!tokenData.success) {
          toast(tokenData.message || 'Could not request credentials.', 'error');
          if (overlay) overlay.style.display = 'flex';
          if (loading) loading.style.display = 'none';
          return;
        }

        // Step 2: Immediately redeem the token
        const credRes  = await fetch(`${API_BASE}/orders/${id}/credentials?t=${tokenData.token}`, {
          headers: { Authorization: `Bearer ${jwt}` },
        });
        const credData = await credRes.json();

        if (!credData.success) {
          toast(credData.message || 'Could not load credentials.', 'error');
          if (overlay) overlay.style.display = 'flex';
          if (loading) loading.style.display = 'none';
          return;
        }

        // Store in closure — never in DOM, never in a global
        _rawCredentials = b64Decode(credData.data);
        showCanvas();

      } catch (err) {
        console.error(err);
        toast('Server error. Please try again.', 'error');
        if (overlay) overlay.style.display = 'flex';
        if (loading) loading.style.display = 'none';
      }
    }

    function showCanvas() {
      const loading = document.getElementById('cred-loading');
      const actions = document.getElementById('cred-actions');
      if (loading) loading.style.display = 'none';
      renderCredentials(_rawCredentials);

      // Update file size badge dynamically
      const sizeBadge = document.getElementById('cred-size-badge');
      if (sizeBadge) {
        const bytes = new Blob([_rawCredentials]).size;
        sizeBadge.textContent = bytes + ' bytes';
      }

      if (actions) actions.style.display = 'flex';
    }

    function hideCredentials() {
      const display = document.getElementById('cred-text-display');
      const overlay = document.getElementById('cred-overlay');
      const actions = document.getElementById('cred-actions');
      if (display)  display.style.display = 'none';
      if (overlay) overlay.style.display = 'flex';
      if (actions) actions.style.display = 'none';
    }

    function copyCredentials() {
      if (!_rawCredentials) { toast('Reveal credentials first.', 'warning'); return; }
      
      let textToCopy = _rawCredentials;
      try {
        const data = JSON.parse(_rawCredentials);
        if (data && typeof data === 'object') {
          textToCopy = '';
          for (const key in data) {
            if (key === 'type') continue;
            textToCopy += `${key.toUpperCase().replace(/_/g, ' ')}: ${data[key]}\n`;
          }
        }
      } catch (e) {}

      navigator.clipboard.writeText(textToCopy)
        .then(() => toast('Credentials copied to clipboard!', 'success'))
        .catch(() => toast('Copy failed. Please select manually.', 'error'));
    }

    // ── Load order ────────────────────────────────────────────────────────────
    async function loadOrder() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }

      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        document.getElementById('page-content').innerHTML =
          '<p style="color:red;text-align:center;">No order ID specified.</p>';
        return;
      }
      document.getElementById('breadcrumb-id').textContent = '#' + id.substring(0, 8).toUpperCase();



      try {
        const res  = await fetch(`${API_BASE}/orders/${id}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();

        if (!data.success) {
          document.getElementById('page-content').innerHTML =
            `<p style="color:red;text-align:center;">${data.message || 'Order not found.'}</p>`;
          return;
        }

        const o = data.order;
        const statusColor = {
          completed: '#16a34a', pending: '#d97706',
          refunded:  '#6366f1', cancelled: '#b91c1c',
        };

        // ── Build credential section ─────────────────────────────────────────
        let credHtml = '';
        if (o.status === 'completed') {
          credHtml = `
          <div class="card" style="margin-bottom:1.5rem; padding: 1.5rem;">
            <h3 style="font-size:1.1rem; margin-bottom:0.4rem; color:var(--primary-deep); font-weight: 700;">🔐 Delivered Credentials</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">
              Access details are securely encrypted. Click the decryption button below to display.
            </p>
            
            <div class="cred-container" id="cred-wrapper">
              <div class="cred-header">
                <div class="cred-filename">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                  </svg>
                  <span>access_credentials.txt</span>
                </div>
                <span class="cred-size-badge" id="cred-size-badge">secured</span>
              </div>
              
              <div class="cred-body-wrapper">
                <div class="cred-loading" id="cred-loading" style="display: none; align-items: center; justify-content: center; gap: 0.75rem; min-height: 200px; color: var(--primary); font-size: 0.88rem; background: #0F172A;">
                  <div class="spinner"></div>
                  <span>Decrypting access data...</span>
                </div>
                
                <pre id="cred-text-display"></pre>
                
                <div class="cred-blur-overlay" id="cred-overlay" onclick="revealCredentials()">
                  <div class="lock-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </div>
                  <h4 style="color: #ffffff; font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem;">Credentials Encrypted</h4>
                  <p style="color: rgba(255, 255, 255, 0.45); font-size: 0.78rem; max-width: 280px; margin-bottom: 0.75rem;">Requires a one-time decryption token to load credentials.</p>
                  <button class="reveal-button-modern">Decrypt & Reveal</button>
                </div>
              </div>
            </div>
            
            <div class="cred-actions-bar" id="cred-actions">
              <button class="action-btn-modern primary-action" onclick="copyCredentials()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copy Content
              </button>
              <button class="action-btn-modern" onclick="downloadCredentials()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download (.txt)
              </button>
              <button class="action-btn-modern" onclick="hideCredentials()" style="margin-left: auto;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Hide
              </button>
            </div>
          </div>`;

        } else if (o.status === 'refunded') {
          credHtml = `
          <div class="card" style="margin-bottom:1.5rem;border-left:4px solid #ef4444; padding: 1.5rem;">
            <div style="display:flex;align-items:flex-start;gap:1rem;">
              <div style="font-size:2rem;flex-shrink:0; line-height: 1;">↩</div>
              <div>
                <h3 style="font-size:1rem;font-weight:700;color:#b91c1c;margin-bottom:0.4rem;">Refund Issued</h3>
                <p style="font-size:0.875rem;color:var(--text-muted);line-height:1.6;">
                  A full refund of <strong style="color:#b91c1c;">$${parseFloat(o.total).toFixed(2)}</strong>
                  has been issued to your account balance.
                  Access to the purchased log has been permanently revoked.
                </p>
              </div>
            </div>
          </div>`;

        } else {
          credHtml = `
          <div class="card" style="margin-bottom:1.5rem;text-align:center;padding:3rem;">
            <div style="font-size:2.5rem;margin-bottom:0.75rem;">⏳</div>
            <p style="color:var(--text-muted); font-size: 0.95rem;">Credentials are being prepared. Please refresh in a moment.</p>
          </div>`;
        }

        document.getElementById('page-content').innerHTML = `
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;">
            <a href="orders.html" class="btn btn-outline" style="font-size:0.85rem;padding:0.5rem 1rem;">← Back to Orders</a>
            <a href="store.html"  class="btn btn-primary" style="font-size:0.85rem;padding:0.5rem 1rem;">Continue Shopping</a>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
            <div>
              <h1 style="font-size:1.5rem;color:var(--primary-deep); font-weight: 800;">Order #${o.id.substring(0,8).toUpperCase()}</h1>
              <p style="color:var(--text-muted);margin-top:0.2rem;font-size:0.875rem;">
                Placed on ${new Date(o.created_at).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
              </p>
            </div>
            <span style="background:${statusColor[o.status]||'#888'}22;color:${statusColor[o.status]||'#888'};border:1px solid ${statusColor[o.status]||'#888'}44;border-radius:20px;padding:0.35rem 0.9rem;font-weight:700;font-size:0.82rem;text-transform:capitalize;">
              ${o.status}
            </span>
          </div>

          ${credHtml}
        `;

        // Credentials ready if order completed
        if (o.status === 'completed') {
          // No activation check needed
        }

      } catch (err) {
        console.error(err);
        document.getElementById('page-content').innerHTML =
          '<p style="color:red;text-align:center;">Failed to load order. Make sure the server is running.</p>';
      }
    }

    loadOrder();
  </script>
</body>
</html>
