<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — On A Daily Logs</title>
  <meta name="description" content="Review your selected bank logs before checkout." />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <style>
    .cart-page { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start; }

    /* ── Cart Items ── */
    .cart-items-panel { display: flex; flex-direction: column; gap: 1rem; }

    .cart-item {
      display: grid;
      grid-template-columns: 44px 1fr auto auto;
      align-items: center;
      gap: 1.25rem;
      padding: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      transition: all var(--transition-smooth);
    }
    .cart-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }

    .cart-icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--bg-accent); border: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800; color: var(--primary);
      flex-shrink: 0;
    }

    .cart-item-body { overflow: hidden; }
    .cart-item-bank { font-size: 0.72rem; text-transform: uppercase; font-weight: 700; color: var(--primary); letter-spacing: 0.05em; margin-bottom: 0.15rem; }
    .cart-item-name { font-size: 0.95rem; font-weight: 700; color: var(--primary-deep); margin-bottom: 0.25rem; }
    .cart-item-info {
      font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;
      margin-bottom: 0.5rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .cart-item-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .cart-tag {
      font-size: 0.75rem; padding: 0.2rem 0.6rem;
      border-radius: var(--radius-pill); border: 1px solid var(--border-soft);
      background: var(--bg-main); color: var(--text-main); font-weight: 600;
    }

    .cart-item-price { font-size: 1.05rem; font-weight: 700; color: var(--primary-deep); white-space: nowrap; }

    .remove-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
      cursor: pointer; color: var(--text-muted); font-size: 1rem;
      transition: all var(--transition-smooth);
    }
    .remove-btn:hover { color: #EF4444; background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.1); }

    /* ── Summary Panel ── */
    .summary-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      position: sticky;
      top: 90px;
      box-shadow: var(--shadow-sm);
    }
    .summary-title { font-size: 1.1rem; font-weight: 700; color: var(--primary-deep); margin-bottom: 1.25rem; }
    .summary-line { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; margin-bottom: 0.75rem; color: var(--text-muted); }
    .summary-line strong { color: var(--primary-deep); }
    .summary-divider { height: 1px; background: var(--border-soft); margin: 1rem 0; }
    .summary-total { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 800; color: var(--primary-deep); }

    .balance-box {
      background: var(--bg-main); border: 1px solid var(--border-soft);
      border-radius: var(--radius-md); padding: 1rem; margin: 1.25rem 0;
    }
    .balance-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .balance-row:last-child { margin-bottom: 0; }

    .empty-cart {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 2rem;
      border: 1px dashed var(--border-soft); border-radius: var(--radius-lg);
      background: var(--bg-card);
    }

    @media (max-width: 850px) {
      .cart-page { grid-template-columns: 1fr; gap: 1.5rem; }
      .summary-panel { position: relative; top: 0; }
    }
  </style>
</head>
<body data-require-auth="true">
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" class="logo-img" alt="Logo">
        <span>On A Daily Logs</span>
      </a>
      <nav><ul class="nav-list" id="main-nav"></ul></nav>
    </div>
  </header>

  <main class="main-content container">
    <!-- Page title -->
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 1.75rem; color: var(--primary-deep); margin-bottom: 0.25rem;">Shopping Cart</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Review your selected items before checking out.</p>
    </div>

    <div class="cart-page">
      <!-- Left: Items -->
      <div class="cart-items-panel" id="cart-items">
        <!-- Populated by cart.js -->
      </div>

      <!-- Right: Summary -->
      <aside class="summary-panel" id="order-summary" style="display:none;">
        <div class="summary-title">Summary</div>

        <div class="summary-line">
          <span>Items</span>
          <strong id="summary-count">0</strong>
        </div>
        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="summary-subtotal">$0.00</strong>
        </div>

        <div class="summary-divider"></div>
        <div class="summary-total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>

        <div class="balance-box">
          <div class="balance-row">
            <span style="color:var(--text-muted);">Account Balance</span>
            <span id="user-balance" style="font-weight:700; color:var(--primary-deep);">$0.00</span>
          </div>
          <div class="balance-row">
            <span style="color:var(--text-muted);">After Purchase</span>
            <span id="balance-after" style="font-weight:700;">$0.00</span>
          </div>
        </div>

        <button id="checkout-btn" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:0.95rem;">
          Confirm &amp; Checkout
        </button>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 On A Daily Logs. All rights reserved.</p> 
    </div>
  </footer>

  <script src="js/toast.js"></script>
  <script defer src="js/cart.js"></script>
</body>
</html>
